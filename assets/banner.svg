<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.0" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0% { transform: scale(1) translate(0px, 0px); opacity: 0.25; }
      50% { transform: scale(1.15) translate(25px, -15px); opacity: 0.45; }
      100% { transform: scale(1) translate(0px, 0px); opacity: 0.25; }
    }
    @keyframes floatPill1 {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }
    @keyframes floatPill2 {
      0% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
      100% { transform: translateY(0px); }
    }
    @keyframes floatPill3 {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
      100% { transform: translateY(0px); }
    }
    @keyframes dashMove {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -40; }
    }

    .orb-1 { animation: pulseOrb 8s ease-in-out infinite; transform-origin: 200px 100px; }
    .orb-2 { animation: pulseOrb 10s ease-in-out infinite 2s; transform-origin: 1000px 250px; }
    .pill-1 { animation: floatPill1 4s ease-in-out infinite; }
    .pill-2 { animation: floatPill2 5s ease-in-out infinite 1s; }
    .pill-3 { animation: floatPill3 4.5s ease-in-out infinite 0.5s; }
    .animated-grid {
      stroke-dasharray: 6 6;
      animation: dashMove 20s linear infinite;
    }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Ambient Orbs in Background -->
  <circle cx="200" cy="90" r="140" fill="#0284c7" class="orb-1" filter="url(#glow)" />
  <circle cx="1020" cy="240" r="160" fill="#7c3aed" class="orb-2" filter="url(#glow)" />

  <!-- Dynamic Technical Gridlines in Background -->
  <g opacity="0.12" stroke="#94a3b8" stroke-width="1" class="animated-grid">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Decorative Subtle Window Mockup Frame behind content -->
  <g opacity="0.35" transform="translate(100, 25)">
    <rect width="1000" height="310" rx="12" fill="none" stroke="#475569" stroke-width="1.5" />
    <circle cx="24" cy="20" r="5" fill="#ef4444" />
    <circle cx="42" cy="20" r="5" fill="#f59e0b" />
    <circle cx="60" cy="20" r="5" fill="#10b981" />
  </g>

  <!-- Dynamic Floating Ecosystem Tags (Positioned away from Center Text) -->
  <!-- Top Left Pill: Cross-Platform -->
  <g class="pill-1" transform="translate(120, 55)">
    <rect width="160" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)" opacity="0.9" />
    <text x="80" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#38bdf8" text-anchor="middle">💻 Cross-Platform</text>
  </g>

  <!-- Top Right Pill: Native Speed -->
  <g class="pill-2" transform="translate(920, 55)">
    <rect width="150" height="34" rx="17" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" filter="url(#shadow)" opacity="0.9" />
    <text x="75" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#818cf8" text-anchor="middle">⚡ Native Speed</text>
  </g>

  <!-- Bottom Left Pill: Webview & Rust -->
  <g class="pill-3" transform="translate(130, 275)">
    <rect width="170" height="34" rx="17" fill="#1e293b" stroke="#c084fc" stroke-width="1.5" filter="url(#shadow)" opacity="0.9" />
    <text x="85" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#c084fc" text-anchor="middle">🦀 Rust &amp; Webviews</text>
  </g>

  <!-- Bottom Right Pill: C++ & C# Toolkits -->
  <g class="pill-1" transform="translate(890, 275)">
    <rect width="180" height="34" rx="17" fill="#1e293b" stroke="#34d399" stroke-width="1.5" filter="url(#shadow)" opacity="0.9" />
    <text x="90" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#34d399" text-anchor="middle">🎨 Pixel-Perfect UIs</text>
  </g>

  <!-- MAIN FOREGROUND HERO CONTENT (Guaranteed Unobscured) -->
  <!-- Top Category Chip -->
  <g transform="translate(600, 92)">
    <rect x="-140" y="-16" width="280" height="32" rx="16" fill="#0f172a" stroke="#6366f1" stroke-width="1.5" opacity="0.95" />
    <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#a5b4fc" letter-spacing="1.5" text-anchor="middle">🚀 CURATED DESKTOP ECOSYSTEM</text>
  </g>

  <!-- Foreground Title -->
  <text x="600" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="900" fill="url(#titleGrad)" letter-spacing="-0.5" text-anchor="middle" filter="url(#shadow)">
    Awesome Desktop Application Frameworks
  </text>

  <!-- Foreground Subtitle -->
  <text x="600" y="208" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#cbd5e1" text-anchor="middle">
    Cross-Platform UI Toolkits • Web-Runtime Containers • Native Compiled Frameworks
  </text>

  <!-- Foreground Technology Badges Strip -->
  <text x="600" y="242" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#94a3b8" letter-spacing="0.5" text-anchor="middle">
    Electron • Tauri • Flutter • Qt • Avalonia • Wails • Slint • Dear ImGui • Iced • Fyne
  </text>

</svg>
